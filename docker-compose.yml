services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_PATH: "/app/data/taskflow.db"
      CORS_ORIGIN: "http://localhost:5173"
    volumes:
      # Mount a named volume so SQLite data persists across container restarts.
      - taskflow_data:/app/data

volumes:
  taskflow_data:

